schema = 1
title = "Summer Salmon Skillet"
chapter = "seafood"
status = "published"
added = 2026-10-19
tags = ["one-pan", "quick", "skillet", "summer", "weeknight"]
description = """
Salmon fillets get a cumin and paprika rub and a slick of harissa, then roast in a preheated \
skillet surrounded by red and yellow cherry tomatoes, shallot and garlic. Crumbled feta and fresh \
dill go on at the end. It's a bright, summery dinner that's ready in about 25 minutes."""
serves = 4
prep_minutes = 10
total_minutes = 25
signoff = "Serve it straight from the skillet, and mind the hot handle!"

[photo]
file = "hero"
