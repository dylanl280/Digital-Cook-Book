schema = 1
title = "White Chicken Corn Chili"
chapter = "chicken"
status = "published"
added = 2026-10-19
tags = ["comfort-food", "creamy", "one-pot", "soup", "weeknight"]
description = """
Shredded chicken, great northern beans, sweet corn and mild green chilies in a creamy, \
cumin-spiced broth. Blending a ladleful of the beans gives the chili its body, and sour cream \
stirred in at the end makes it silky. It all comes together in one pot in about 45 minutes, \
ready for a pile of toppings."""
serves = 5
prep_minutes = 10
cook_minutes = 25
total_minutes = 45
signoff = "Ladle it up, pile on your favorite toppings and enjoy every cozy spoonful!"
notes = [
  "No cooked chicken? Add {1 1/2} lbs raw chicken with the broth in step 2, then lift it out, shred it and stir it back in before serving.",
  "For a milder pot, use 1 can of green chilies instead of 2 and leave out the cayenne.",
]

