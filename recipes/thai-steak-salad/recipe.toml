schema = 1
title = "Thai Steak Salad"
chapter = "beef"
status = "published"
added = 2026-10-19
tags = ["quick", "salad", "summer", "weeknight"]
description = """
Juicy seared sirloin, sliced thin and tossed with crisp lettuce, cherry tomatoes, cucumber, red \
onion and handfuls of fresh mint and cilantro. A pounded chili, garlic and lime dressing balances \
salty, sour, sweet and hot, and chopped peanuts add crunch. The steak needs just a few minutes in \
a smoking-hot pan."""
serves = 2
prep_minutes = 20
cook_minutes = 5
total_minutes = 25
signoff = "Dig in while the steak is still warm and the herbs are bright!"

