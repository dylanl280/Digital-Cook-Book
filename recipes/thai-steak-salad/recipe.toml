[[ingredients]]
group = "For the dressing"
items = [
  "1/2 teaspoon bird's eye or Thai chili, deseeded and finely minced ({1/4} teaspoon for mild, {1} teaspoon for a decent kick)",
  "1/4 teaspoon finely minced garlic (about {1/2} small clove)",
  "1 tablespoon finely chopped cilantro (coriander) stems",
  "2 1/4 teaspoons white sugar",
  "2 tablespoons fish sauce",
  "3 tablespoons lime juice",
  "1 tablespoon grapeseed oil (or canola or vegetable oil)",
  "1 small pinch cooking or kosher salt",
]

[[ingredients]]
group = "For the beef"
items = [
  "7–8 oz ({200–250} g) sirloin steak (good quality), about 2 cm (4/5 inch) thick, at room temperature",
  "1 tablespoon oil (vegetable, peanut or canola)",
  "1/4 teaspoon each salt and pepper",
]

[[ingredients]]
group = "For the salad"
items = [
  "2 heaped cups mixed lettuce leaves",
  "10 cherry tomatoes, halved",
  "1/4 small red onion, very finely sliced",
  "1/2 cucumber, deseeded if you like, cut horizontally, then sliced (about {1/3} cup)",
  "1/4 cup cilantro (coriander) leaves, lightly packed",
  "1/4 cup mint leaves, lightly packed",
  "1/4 cup roasted unsalted peanuts, finely chopped",
  "Extra cilantro and mint leaves, to garnish",
]

[[steps]]
title = "Make the Dressing"
actions = [
  "Pound the chili, garlic, cilantro stems and pinch of salt with a mortar and pestle until they form a smooth paste.",
  "Mix in the sugar, fish sauce, lime juice and oil. Taste, adjust the sugar, lime juice and fish sauce to your liking, and set aside.",
  "No mortar and pestle? Finely mince the garlic, cilantro stems and chili, smear them into a paste with the side of your knife, then shake everything together in a jar.",
]

[[steps]]
title = "Sear the Steak"
actions = [
  "Get a skillet really hot over high heat; it should just be starting to smoke.",
  "Drizzle {1/2} tablespoon of the oil over each side of the steak and season with the salt and pepper.",
  "Cook it to your liking. For a 2 cm (4/5 inch) steak, sear 2 minutes per side for medium-rare, until it reads 125°F (52°C) inside.",
  "For medium, give it 2 1/2 minutes per side instead, to 135°F (57°C) inside.",
]

[[steps]]
title = "Rest the Steak"
actions = [
  "Move the steak to a plate, tent it loosely with foil and let it rest for 10 minutes. It keeps cooking a little as it rests.",
]

[[steps]]
title = "Toss the Salad"
actions = [
  "Toss the lettuce in a bowl with {1} tablespoon of the dressing.",
  "Slice the steak thinly against the grain, cutting across the fibers so every slice is tender.",
  "In a second bowl, toss the steak gently with the tomatoes, onion, cucumber, cilantro leaves, mint and most of the remaining dressing.",
]

[[steps]]
title = "Serve"
actions = [
  "Pile the lettuce onto plates and heap the steak salad on top.",
  "Sprinkle with the peanuts, garnish with the extra herbs, drizzle with the last of the dressing and serve right away.",
]
