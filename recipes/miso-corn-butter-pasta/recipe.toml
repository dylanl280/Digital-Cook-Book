schema = 1
title = "Miso Corn Butter Pasta"
chapter = "meatless"
status = "published"
added = 2026-10-19
tags = ["pasta", "quick", "summer", "vegetarian", "weeknight"]
description = """
Sweet summer corn works twice in this pasta: the kernels go into a nutty brown-butter miso \
sauce, and the bare cobs simmer into a light stock that makes it silky. Campanelle catches \
every drop, while basil, lemon and black pepper keep it bright. It's ready in about 15 minutes, \
so make it the moment good corn shows up."""
total_minutes = 15
signoff = "Make it while the corn is sweet, and enjoy every buttery bite!"
notes = [
  "No miso? For a brighter version, swap it for fresh thyme, squeeze in extra lemon and add a little chili flake.",
]

