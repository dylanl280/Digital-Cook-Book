title = "Creamy Cajun Chicken Orzo"
chapter = "chicken"
status = "published"
added = 2026-10-19
tags = ["comfort-food", "creamy", "one-pan", "pasta"]
description = """
Cajun-spiced chicken breasts are seared until golden, then sliced over orzo that's toasted \
with tomato paste and cooked in stock until creamy. Parmesan, cream, spinach and fresh lemon \
finish the sauce, and everything happens in the same pan."""
signoff = "Spoon it into bowls while it's hot and enjoy every creamy bite!"

