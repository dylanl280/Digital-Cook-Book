schema = 1
title = "Japanese Curry"
chapter = "beef"
status = "published"
added = 2026-10-19
tags = ["comfort-food", "one-pot"]
description = """
Tender beef, potatoes and carrots in a thick, glossy sauce built on store-bought Japanese curry \
roux, served with short-grain rice. Slowly caramelized onions give it a deep, mellow sweetness \
(skip them if you're short on time), and a secret ingredient or two, such as red wine, coffee or \
dark chocolate, makes the pot your own."""
serves = 6
prep_minutes = 10
cook_minutes = 80
total_minutes = 90
signoff = "Grab a spoon and enjoy every rich, cozy bite!"

