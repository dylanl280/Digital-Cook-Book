schema = 1
title = "Kale Caesar Salad"
chapter = "meatless"
status = "published"
added = 2026-10-19
tags = ["dinner", "lunch", "make-ahead", "salad"]
description = """
Silky ribbons of lacinato kale are massaged until tender, then tossed in a proper from-scratch \
Caesar dressing of anchovy, garlic, egg yolk and parmesan. Golden garlic panko crumbs take the \
place of croutons and find their way into every bite. Serve it as a hearty main for two or a \
side for four."""
serves = 2
prep_minutes = 20
cook_minutes = 10
signoff = "Shower it with crumbs and parmesan, and dig in while it's still crunchy!"
notes = [
  "The times above are for the salad; making the garlic breadcrumbs adds about 15 minutes (5 to prep, 10 to cook).",
  "Make ahead: toast the breadcrumbs and slice the kale 1–2 days early. Keep the kale ribbons covered in the fridge and wait to massage them until just before serving. Peeled hard-boiled eggs keep in a covered container in the fridge for up to a week.",
  "The dressing makes about 1 cup, more than this salad needs. It's best freshly made but keeps for 1–2 days in an airtight container in the fridge; let it sit at room temperature for 20 minutes and stir well before using.",
  "The breadcrumbs are A Beautiful Plate's own Crispy Garlic Bread Crumbs recipe, which the salad links to. A batch makes about 1 cup, and leftovers keep in an airtight container at room temperature for 3–4 days.",
  "For a gluten-free version, swap the breadcrumbs for crunchy roasted chickpeas or homemade garlic chips.",
]

