[[ingredients]]
group = "For the salad"
items = [
  "2 bunches ({12–14} ounces) Tuscan (lacinato) kale",
  "Extra virgin olive oil, for drizzling",
  "Parmigiano-Reggiano cheese, as desired, for topping",
  "Hard-boiled eggs (optional)",
]

[[ingredients]]
group = "For the garlic breadcrumbs"
items = [
  "3 tablespoons ({45} mL) extra virgin olive oil",
  "2 large garlic cloves, smashed",
  "1 cup ({80} g) panko breadcrumbs (or homemade coarse breadcrumbs)",
  "1/4 teaspoon kosher salt",
  "1/4 teaspoon freshly ground black pepper",
  "Finely chopped fresh herbs, such as parsley, thyme or rosemary (optional)",
]

[[ingredients]]
group = "For the dressing"
items = [
  "2–3 anchovy fillets (packed in olive oil), drained",
  "2 medium garlic cloves",
  "Kosher salt",
  "3 large egg yolks (local or pasture-raised)",
  "2 teaspoons Dijon mustard",
  "1/4 teaspoon Worcestershire sauce",
  "1/3 cup ({80} mL) avocado or vegetable oil",
  "1 tablespoon ({15} mL) freshly squeezed lemon juice",
  "1/3 to 1/2 cup finely grated Parmigiano-Reggiano cheese, plus more for topping",
  "1/2 teaspoon freshly ground black pepper, plus more to taste",
]

[[steps]]
title = "Boil the Eggs"
actions = [
  "If you're serving the salad with eggs, bring a small saucepan of water to a boil, gently lower in the eggs and turn the heat down to a very low simmer.",
  "Cook for 10 minutes for fully firm whites and tender, cooked yolks. Meanwhile, set up a bowl of ice water.",
  "Lift the eggs into the ice bath with a slotted spoon, and peel them once they're cool enough to handle.",
]

[[steps]]
title = "Toast the Breadcrumbs"
actions = [
  "Set a medium skillet (8 to 10 inches) over medium heat with the {3} tablespoons of olive oil. Stir the smashed garlic around in it for about 2–3 minutes, until it smells fragrant and turns lightly golden.",
  "Add the panko and stir to coat it evenly in the garlicky oil. Keep cooking, stirring and tossing often, until deeply golden, about 4–6 minutes.",
  "Season with the salt and pepper, and stir in the herbs if you're using them.",
  "Tip the crumbs into a large bowl right away to cool. Eat the garlic cloves or discard them.",
]

[[steps]]
title = "Slice the Kale"
actions = [
  "Strip the kale leaves from the stems and discard the tough stems. Wash the leaves and dry them thoroughly.",
  "Stack several leaves, roll them lengthwise into a long log and slice crosswise into thin ribbons, roughly 1/2-inch thick.",
  "Put the ribbons in a large salad bowl and repeat with the remaining leaves.",
]

[[steps]]
title = "Massage the Kale"
actions = [
  "Drizzle the kale with a touch of olive oil.",
  "Massage the leaves with both hands until they soften and wilt slightly, then set the bowl aside while you make the dressing.",
]

[[steps]]
title = "Mash the Anchovies"
actions = [
  "Pile the drained anchovy fillets and the garlic cloves on a cutting board and sprinkle lightly with kosher salt.",
  "Chop them finely together, then press and smear with the flat side of your knife until they form a paste.",
]

[[steps]]
title = "Whisk the Dressing"
actions = [
  "Put the egg yolks in a medium mixing bowl and add the anchovy-garlic paste, Dijon mustard and Worcestershire sauce. Whisk to combine.",
  "Whisking constantly with one hand, pour in the oil with the other, drop by drop at first and then in a very fine stream, until the dressing is thick and emulsified.",
  "Stir in the lemon juice, the finely grated Parmigiano-Reggiano and the black pepper, then season to taste.",
]

[[steps]]
title = "Toss and Serve"
actions = [
  "Gently toss the kale with just enough dressing to coat the leaves evenly. You'll have some dressing left over.",
  "Taste, and add more salt and freshly ground black pepper as needed.",
  "Top each serving with the garlic breadcrumbs and a dusting of Parmigiano-Reggiano, finely grated on a microplane.",
  "For a hearty main course, serve with the hard-boiled eggs, sliced, if you like.",
]
