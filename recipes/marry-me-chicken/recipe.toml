schema = 1
title = "Marry Me Chicken"
chapter = "chicken"
status = "published"
added = 2026-10-19
tags = ["creamy", "one-pan", "quick", "weeknight"]
description = """
Thin, golden chicken cutlets simmered in a silky parmesan cream sauce with sun-dried tomatoes, \
garlic and a pinch of chili. Everything happens in one skillet in about 25 minutes, and it \
lives up to its famous name. Serve it over pasta or rice to catch every drop of sauce."""
serves = 6
prep_minutes = 10
cook_minutes = 15
signoff = "Serve warm over pasta or rice, and enjoy every last drop of sauce!"

