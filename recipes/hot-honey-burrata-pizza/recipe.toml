accessed = 2026-10-19

[[ingredients]]
items = [
  "1 pizza crust (Cappello's Naked Pizza Crust was used, but any plain crust works)",
  "2 tablespoons pizza sauce (Rao's was used, but any jarred or homemade sauce works)",
  "1/2 cup cherry tomatoes, sliced",
  "1 Chomps Italian Beef Stick, sliced",
  "1/2 ball of fresh burrata",
  "Red pepper flakes",
  "Hot honey",
]

[[steps]]
title = "Heat the Oven"
actions = [
  "Preheat the oven according to your pizza crust's instructions.",
]

[[steps]]
title = "Top the Crust"
actions = [
  "Spread the {2} tablespoons of pizza sauce evenly over the crust.",
  "Scatter the sliced cherry tomatoes and beef stick over the top, covering the crust evenly.",
]

[[steps]]
title = "Bake"
actions = [
  "Bake the pizza for as long as the crust's instructions say.",
  "While it bakes, tear {1/2} ball of burrata into small chunks.",
]

[[steps]]
title = "Add the Burrata"
actions = [
  "A few minutes before the pizza is done, dot the burrata chunks over the top.",
  "Let it bake for another 2–3 minutes.",
]

[[steps]]
title = "Finish"
actions = [
  "Out of the oven, scatter red pepper flakes over the top and finish with a generous drizzle of hot honey.",
  "Slice and serve.",
]
