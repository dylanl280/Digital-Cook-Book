schema = 1
title = "Hot Honey Burrata Pizza"
chapter = "beef"
status = "published"
added = 2026-10-19
tags = ["pizza", "quick", "spicy"]
description = """
A plain pizza crust gets a thin layer of sauce, sliced cherry tomatoes and coins of Italian beef \
stick, then soft chunks of burrata go on for the last few minutes of baking. Red pepper flakes and \
a drizzle of hot honey finish it with a sweet, spicy kick."""
makes = "1 pizza"
signoff = "Enjoy every sweet, spicy and creamy bite!"

[photo]
file = "hero"
alt = "Thin-crust pizza cut into slices, topped with roasted cherry tomatoes, coins of meat stick, melting burrata, red pepper flakes and hot honey"
focal = "50% 48%"
credit = "Chomps"
credit_url = "https://chomps.com/blogs/recipes/hot-honey-burrata-pizza"

[source]
kind = "website"
