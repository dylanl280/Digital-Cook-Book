schema = 1
title = "Chicken and Gnocchi Soup"
chapter = "chicken"
status = "published"
added = 2026-10-19
tags = ["comfort-food", "creamy", "one-pot", "soup"]
description = """
An easy one-pot soup of tender gnocchi, seasoned chicken, carrots, celery and spinach in a \
rich, creamy broth. The chicken cooks first, the soup builds in the same pot, and the gnocchi \
need just a few minutes at the end."""
signoff = "Ladle it into bowls and enjoy it while it's hot!"

