description = """
Tender, juicy chicken breasts are paired with a vibrant medley of roasted bell peppers, zucchini, \
and onions, all seasoned to perfection. Easy to prepare and full of flavor, it's a healthy choice \
that doesn't compromise on taste. Ideal for a quick dinner that feels like a gourmet treat!"""
serves = 2
prep_minutes = 15
